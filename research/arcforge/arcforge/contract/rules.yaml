# rules.yaml — the registered verdict rules of RE-MEANING (arc-rules/1), TEMPLATE.
#
# This file is the template M1 ships. At R00 the power analysis fills `mde_r00` (via
# `arcforge prereg freeze`), `arcforge prereg lint --frozen` passes, Fable signs off, and the frozen
# copy is hashed into PREREG together with schemas/arc-report-1.json. From then on every
# verdicts.json names the sha256 of the frozen copy (run.rules_sha256) and `arcforge verdict`
# refuses any other rules file.
#
# HOW TO READ A RULE
# - applies_to: a list of {runs, branches} clauses. A rule is IN SCOPE for a run when some clause
#   contains both run.id and run.branch ('*' means every run or every branch; a name under `sets`
#   expands to its members). In scope, the rule reads its fields; a null among them evaluates to
#   NOT_COMPUTABLE, which fails the run and is never a verdict. Out of scope, the rule reads nothing
#   and its status is NOT_APPLICABLE.
# - rows: the VerdictRows the rule reads. `c1: {...}` defines row '<rule>.c1'; `c1: H1.c1` reuses a
#   row another rule defines (H1.F reads H1's rows at R05K).
# - outcomes: [status, condition] pairs, checked in order; the first true condition decides, and
#   `else` applies when none holds. Conditions use the expression language in contract/expr.py:
#   Python syntax (and / or / not, < <= >= ==, in), row fields as `c1.ci_hi_raw`, verdicts.json
#   fields as `vault.sign` or `gates_summary.I1_pass_effective`.
# - Every field a rule can read — over every branch of every condition, its lets, and its rows'
#   own expressions — is resolved before anything is evaluated, so NOT_COMPUTABLE never depends on
#   evaluation order. `arcforge prereg lint` checks the same set against arc-report/1 and the run
#   plan (contract/produces.yaml) for every (run, branch) in scope.
#
# ROWS
# - kind: superiority | guard | bound | ratio | report. tau = max(tau_floor, mde_r00[mde]) when
#   both are set, tau_floor when only it is set, and null otherwise.
# - verdict_component: REPORTED for report rows and unregistered rows; else FIRES/CLEAR from the
#   row's `fires`, or PASS/FAIL from its `passes` (a superiority row defaults to PASS(x)).
# - holm: whether the row is in its hypothesis's Holm family (default: registered superiority
#   rows). Rows outside the family carry holm_rank 0, alpha_adj = alpha, the raw CI as the
#   adjusted CI, and p_holm = p_raw.
# - estimator: how `arcforge verdict` recomputes the row from its per-query score file
#   (contract/stats.py): pigeonhole (default), cluster_ratio (ratio rows) or refit_pooled (P@100).
#
# Statuses are the closed set of arc-report/1. NOT_TESTED is arc-level only (arc_summary at
# R10/R10K): a rule that no run of the realized branch path applied. H7, when its slot never frees,
# takes H7.report's status (arc_fallback).

schema: arc-rules/1

stats:
  alpha: 0.05
  # Two-way pigeonhole bootstrap over source and target records (Owen 2007) on seed-averaged
  # per-query scores; ratio rows use the record-clustered bootstrap.
  resamples: 10000
  # Paired randomization test (sign flips of per-query differences), two-sided.
  permutations: 10000
  # P@100 rows: for the point fit and for each refit, this many resamples of the labelled items;
  # the CI pools all of them (2,000 x 6 = 12,000 values).
  refit_resamples: 2000
  # Percentile CIs, linear interpolation between order statistics. Each row's random streams are
  # seeded from sha256('<comparison_id>|boot') and sha256('<comparison_id>|perm').

sets:
  K: [N-F, S-F, S-C-F]

# THE PREREG BRANCH TABLE: every branch path's run order, with run.branch at each run.
# run.branch is 'N' for r00-r04 on every path and for r05-r07 on the N path. r05K is 'S'. A branch
# name applies from the first run after the decision that creates it.
branch_table:
  N:     [[r00, N], [r01, N], [r02, N], [r03, N], [r04, N], [r05, N], [r06, N], [r07, N], [r08, N], [r09, N], [r10, N]]
  N-F:   [[r00, N], [r01, N], [r02, N], [r03, N], [r04, N], [r05, N], [r06, N], [r07K, N-F], [r08, N-F], [r09K, N-F], [r10K, N-F]]
  S-F:   [[r00, N], [r01, N], [r02, N], [r03, N], [r04, N], [r05K, S], [r06, S-F], [r07K, S-F], [r08, S-F], [r09K, S-F], [r10K, S-F]]
  S-C:   [[r00, N], [r01, N], [r02, N], [r03, N], [r04, N], [r05K, S], [r06, S-C], [r07, S-C], [r08, S-C], [r09, S-C], [r10, S-C]]
  S-C-F: [[r00, N], [r01, N], [r02, N], [r03, N], [r04, N], [r05K, S], [r06, S-C], [r07, S-C], [r08K, S-C-F], [r09K, S-C-F], [r10K, S-C-F]]

# Where the paths fork: after run `after` (on branch `branch`), `rule`'s status selects the paths.
decisions:
  - {after: r04, branch: N, rule: FUT, outcomes: {FIRED: [S-F, S-C, S-C-F], NOT_FIRED: [N, N-F]}}
  - {after: r05K, branch: S, rule: H1.F, outcomes: {FALSIFIED: [S-F], NOT_FALSIFIED: [S-C, S-C-F]}}
  - {after: r06, branch: N, rule: H1, outcomes: {FALSIFIED: [N-F], SUPPORTED: [N], FUSION_ONLY: [N], INCONCLUSIVE: [N]}}
  - {after: r07, branch: S-C, rule: H1, outcomes: {FALSIFIED: [S-C-F], SUPPORTED: [S-C], FUSION_ONLY: [S-C], INCONCLUSIVE: [S-C]}}

# Vault reads per branch path (review 3, required change 2b). The lint checks that vault.read's
# scope expands to exactly these counts, and never more than 3.
vault_read_budget: {N: 3, N-F: 3, S-F: 2, S-C: 3, S-C-F: 3}

# The R00 minimum detectable effects (80% power, from the per-cluster variance of B8(W1) - B2).
# Null in the template; `arcforge prereg freeze` writes them at R00 and they never change after.
mde_r00:
  AB: null
  D: null
  CE: null
  G: null
  vault: null
  frontier: null

# Macros, applied to every row of their arguments: PASS(c1, c2) holds when PASS holds for both.
defines:
  PASS: 'x.point >= x.tau and x.ci_lo_adj > 0 and x.point > x.seed_sd'

rules:
  # ---- the futility look and the kill-only checkpoint -------------------------------------

  - id: FUT
    title: Futility look at R04 (futility-only, no alpha spent)
    applies_to: [{runs: [r04], branches: [N]}]
    rows:
      c1: {kind: guard, arm_a: hyb(champ), arm_b: B2, stratum: AB, metric: mrr@10, unit: fraction,
           fires: 'x.point < -0.02 and x.ci_hi_raw < 0'}
    outcomes:
      # 'unavailable' (a lost vault key) does not fire.
      - [FIRED, 'FIRES(c1) and vault.sign in (-1, 0)']
    else: NOT_FIRED
    gates_summary:
      futility_fired: "status == 'FIRED'"

  - id: H1.F
    title: H1 kill-only checkpoint at R05K (it can falsify, never support)
    applies_to: [{runs: [r05K], branches: [S]}]
    rows: {c1: H1.c1, g1: H1.g1}
    outcomes:
      - [FALSIFIED, 'c1.ci_hi_raw < 0.02 or FIRES(g1)']
    else: NOT_FALSIFIED

  # ---- hypotheses -------------------------------------------------------------------------

  - id: H1
    title: The lexicon is the model (headline and kill criterion)
    applies_to:
      - {runs: [r06], branches: [N]}
      - {runs: [r07], branches: [S-C]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    rows:
      c1: {kind: superiority, arm_a: hyb(champ), arm_b: B2, stratum: AB, metric: mrr@10,
           unit: fraction, tau_floor: 0.04, mde: AB}
      # c2 and c4 are scored on LLM qrels: registered only while I1 holds (review 3, suggestion 1).
      c2: {kind: superiority, arm_a: hyb(champ), arm_b: B2, stratum: D, metric: ndcg@10,
           unit: fraction, tau_floor: 0.04, mde: D, registered: gates_summary.I1_pass_effective}
      c3: {kind: superiority, arm_a: hyb(champ), arm_b: hyb(B4), stratum: AB, metric: mrr@10,
           unit: fraction, tau_floor: 0.04, mde: AB}
      c4: {kind: superiority, arm_a: hyb(champ), arm_b: hyb(B4), stratum: D, metric: ndcg@10,
           unit: fraction, tau_floor: 0.04, mde: D, registered: gates_summary.I1_pass_effective}
      # 'No significant inferiority beyond 0.02' (not a non-inferiority test).
      g1: {kind: guard, arm_a: champ, arm_b: B2, stratum: AB, metric: mrr@10, unit: fraction,
           fires: 'x.point < -0.02 and x.ci_hi_raw < 0'}
    let:
      # The active Holm family: [c1, c3] (m = 2) until I1 passes.
      F: '[c1, c2, c3, c4] if gates_summary.I1_pass_effective else [c1, c3]'
    outcomes:
      - [FALSIFIED, 'c1.ci_hi_raw < 0.02 or FIRES(g1)']
      - [SUPPORTED, 'PASS(F) and vault.sign == 1']
      - [FUSION_ONLY, 'PASS(c1) and (PASS(c2) or not gates_summary.I1_pass_effective) and vault.sign == 1']
    else: INCONCLUSIVE
    provisional: 'run.id not in ("r10", "r10K")'

  - id: H2
    title: Context-sum initialization
    applies_to:
      - {runs: [r02], branches: [N]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    rows:
      # arm_a = context-sum + prompt-bias (the registered arm); arm_b = isolated.
      c1: {kind: superiority, arm_a: 'arm:context_sum_bias.untrained', arm_b: 'arm:isolated.untrained',
           stratum: AB, metric: mrr@10, unit: fraction, tau_floor: 0.05, mde: AB}
      c2: {kind: superiority, arm_a: 'arm:context_sum_bias.untrained', arm_b: 'arm:isolated.untrained',
           stratum: G, metric: mrr, unit: fraction, tau_floor: 0.08, mde: G}
      c3: {kind: superiority, arm_a: 'arm:context_sum_bias', arm_b: 'arm:isolated',
           stratum: AB, metric: mrr@10, unit: fraction, tau_floor: 0.035, mde: AB}
    outcomes:
      - [FALSIFIED, 'c3.ci_hi_raw < 0.02 or c2.ci_hi_raw < 0.03']
      - [SUPPORTED, 'PASS(c1, c2, c3)']
    else: INCONCLUSIVE

  - id: H3
    title: Re-meaning, primary (P@100 on the owner's blind 're-meant' label)
    applies_to:
      - {runs: [r03], branches: [N]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    rows:
      c1: {kind: superiority, arm_a: 'arm:residualized', arm_b: 'arm:logodds', stratum: POOL.remeaning,
           metric: p@100, unit: fraction, tau_floor: 0.15, estimator: refit_pooled}
      c2: {kind: superiority, arm_a: 'arm:residualized', arm_b: 'arm:raw_displacement',
           stratum: POOL.remeaning, metric: p@100, unit: fraction, tau_floor: 0.10,
           estimator: refit_pooled}
    outcomes:
      # Review 3, required change 1: non-significance is not falsification.
      - [FALSIFIED, 'c1.ci_hi_raw < 0.05']
      - [SUPPORTED, 'PASS(c1) and PASS(c2)']
    else: INCONCLUSIVE
    derive:
      remeaning.label: "'re-meaning lexicon' if status == 'SUPPORTED' else 'frequency lexicon'"

  - id: H3a
    title: Two-world prior x residualized displacement (arm 3 - arm 2)
    applies_to: [{runs: [r03], branches: [N]}]
    rows:
      a1: {kind: superiority, arm_a: 'arm:two_world_x_disp', arm_b: 'arm:two_world', stratum: AB,
           metric: mrr@10, unit: fraction, tau_floor: 0.035, mde: AB}
    outcomes:
      - [FALSIFIED, 'a1.ci_hi_raw < 0.02']
      - [SUPPORTED, 'PASS(a1)']
    else: INCONCLUSIVE

  - id: H3b
    title: Whose map is it (stronger web teacher, all teachers under isolated init)
    applies_to:
      - {runs: [r08], branches: [N, N-F, S-F, S-C]}
      - {runs: [r08K], branches: [S-C-F]}
    defines:
      BETTER: 'x.point >= x.mde_r00 and x.ci_lo_adj > 0'
    rows:
      # Mean 20-NN displacement (scale-free Jaccard measure), Qwen - Gemma-isolated.
      b1: {kind: superiority, holm: true, arm_a: 'arm:teacher.qwen3-embedding-0.6b',
           arm_b: 'arm:teacher.embeddinggemma-2.isolated', stratum: POOL.lexicon,
           metric: displacement@20, unit: fraction, passes: 'x.ci_hi_adj < 0'}
      b2: {kind: bound, holm: true, arm_a: 'arm:teacher.qwen3-embedding-0.6b',
           arm_b: 'arm:teacher.embeddinggemma-2.isolated', stratum: AB, metric: mrr@10,
           unit: fraction, mde: AB, fires: 'BETTER(x)'}
    outcomes:
      - [FALSIFIED, 'BETTER(b2) or b1.ci_lo_raw > 0']
      - [SUPPORTED, 'b1.ci_hi_adj < 0 and not BETTER(b2)']
    else: INCONCLUSIVE

  - id: H4
    title: The author's structure teaches, not pair volume
    applies_to:
      - {runs: [r05], branches: [N]}
      - {runs: [r06], branches: [S-C]}
    rows:
      c1: {kind: superiority, arm_a: 'arm:real_edges', arm_b: 'arm:rewired_edges', stratum: AB,
           metric: mrr@10, unit: fraction, tau_floor: 0.04, mde: AB}
      g1: {kind: guard, arm_a: 'arm:real_edges', arm_b: 'arm:rewired_edges', stratum: CE,
           metric: ndcg@10, unit: fraction, fires: 'x.point <= -0.03 and x.ci_hi_raw < 0'}
    outcomes:
      - [FALSIFIED, 'c1.ci_hi_raw < 0.02 or FIRES(g1)']
      - [SUPPORTED, 'PASS(c1)']
    else: INCONCLUSIVE

  - id: H5
    title: Constraints, not voices
    applies_to:
      - {runs: [r06], branches: [N, S-F]}
      - {runs: [r07], branches: [S-C]}
    rows:
      c1: {kind: superiority, arm_a: 'arm:bank.constraint', arm_b: 'arm:bank.generic', stratum: CE,
           metric: ndcg@10, unit: fraction, tau_floor: 0.05, mde: CE}
      # A non-superiority bound: the persona bank does NOT beat the constraint bank by 0.05 or more.
      b1: {kind: bound, arm_a: 'arm:bank.persona', arm_b: 'arm:bank.constraint', stratum: CE,
           metric: ndcg@10, unit: fraction, fires: 'x.point >= 0.05 and x.ci_lo_raw > 0'}
    outcomes:
      - [FALSIFIED, 'FIRES(b1) or c1.ci_hi_raw < 0.02']
      - [SUPPORTED, 'PASS(c1)']
    else: INCONCLUSIVE

  - id: H6
    title: Growth without retraining (simulated, by owner ruling 3)
    applies_to:
      - {runs: [r09], branches: [N, S-C]}
      - {runs: [r09K], branches: [K]}
    rows:
      r1: {kind: ratio, arm_a: 'arm:hot_add', arm_b: 'arm:retrain', stratum: FRONTIER, metric: mrr@10,
           unit: ratio, estimator: cluster_ratio, passes: 'x.point >= 0.90 and x.ci_lo_raw >= 0.80'}
      r2: {kind: ratio, arm_a: 'arm:hot_add', arm_b: 'arm:retrain', stratum: FRONTIER, metric: ndcg@10,
           unit: ratio, estimator: cluster_ratio, passes: 'x.point >= 0.90 and x.ci_lo_raw >= 0.80'}
      g1: {kind: guard, arm_a: 'arm:retrain', arm_b: 'arm:frozen', stratum: V1_CORE, metric: mrr@10,
           unit: fraction, fires: 'x.point < -0.01'}
    outcomes:
      - [FALSIFIED, 'min(r1.point, r2.point) < 0.80 or r1.ci_hi_raw < 0.90 or r2.ci_hi_raw < 0.90']
      - [SUPPORTED, 'r1.point >= 0.90 and r2.point >= 0.90 and r1.ci_lo_raw >= 0.80 and r2.ci_lo_raw >= 0.80 and g1.point >= -0.01']
    else: INCONCLUSIVE

  - id: H7
    title: Static attributions are a faithful surrogate (registered only on the kill path)
    applies_to:
      - {runs: [r07K], branches: [N-F, S-F]}
      - {runs: [r08K], branches: [S-C-F]}
    rows:
      c1: {kind: superiority, arm_a: 'arm:attribution.static', arm_b: 'arm:attribution.ig',
           stratum: POOL.trace, metric: rho, unit: rho, tau_floor: 0.05}
    outcomes:
      - [FALSIFIED, 'c1.ci_hi_raw < 0']
      - [SUPPORTED, 'PASS(c1)']
    else: INCONCLUSIVE
    arc_fallback: H7.report

  - id: H7.report
    title: Surrogate faithfulness, exploratory row on the normal path
    applies_to:
      - {runs: [r07], branches: [N]}
      - {runs: [r08], branches: [S-C]}
    rows:
      c1: {kind: report, registered: false, arm_a: 'arm:attribution.static', arm_b: 'arm:attribution.ig',
           stratum: POOL.trace, metric: rho, unit: rho, prediction: 'x.point >= 0'}
    status: REPORTED

  - id: K1
    title: The lexicon headline on the kill path (BM25-lexeme vs BM25-word)
    applies_to:
      - {runs: [r07K], branches: [N-F, S-F]}
      - {runs: [r08K], branches: [S-C-F]}
      - {runs: [r10K], branches: [K]}
    rows:
      k1: {kind: superiority, arm_a: B2, arm_b: B2w, stratum: AB, metric: mrr@10, unit: fraction,
           tau_floor: 0.03, mde: AB}
      k2: {kind: superiority, arm_a: B2, arm_b: B2w, stratum: D.coinage+entity, metric: ndcg@10,
           unit: fraction, tau_floor: 0.03, mde: D}
    outcomes:
      - [FALSIFIED, 'k1.ci_hi_raw < 0.01']
      - [SUPPORTED, 'PASS(k1) and PASS(k2)']
    else: INCONCLUSIVE
    # ship.kill_bm25 := 'lexeme' if SUPPORTED else 'bm25f' (written by `arcforge ship`).

  # ---- instrument gates -------------------------------------------------------------------

  - id: I1
    title: Judges (owner kappa and Kendall-CI over the 8 registered systems)
    # At r01 it is recomputed only after a re-judge; otherwise the r00 inputs are carried forward
    # with rejudged false.
    applies_to:
      - {runs: [r00, r01], branches: [N]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    outcomes:
      - [PASS, 'gates_inputs.I1.kappa_qw_owner >= 0.6 and gates_inputs.I1.min_kendall_ci_lo >= 0.6']
    else: FAIL
    gates_summary:
      I1_pass: "status == 'PASS'"
      # The latest I1.pass at or before run.id: this run's own when I1 is in scope, otherwise the
      # value carried forward from the last run that decided it.
      I1_pass_effective: "status == 'PASS' if in_scope else gates_inputs.I1_prior_pass"
    derive:
      gates.I1.pass: "status == 'PASS'"

  - id: I2
    title: Leakage triad (chunk-random vs record-disjoint vs C_open)
    applies_to: [{runs: [r04], branches: [N]}]
    reads: [gates_inputs.I2.inflation_ratio]
    status: REPORTED
    derive:
      gates.I2.prediction_met: 'gates_inputs.I2.inflation_ratio >= 2.0'

  - id: I3
    title: Shortcut mass, student and teacher, chrome in and out
    applies_to: [{runs: '*', branches: '*'}]
    reads:
      - gates_inputs.I3.student_chrome_in
      - gates_inputs.I3.student_chrome_out
      - gates_inputs.I3.teacher_chrome_in
      - gates_inputs.I3.teacher_chrome_out
    status: REPORTED

  - id: I4
    title: Drift panel (2k fixed pairs re-judged every run from R01)
    applies_to:
      - {runs: [r01, r02, r03, r04, r05, r05K, r06, r07, r07K, r08, r08K, r09, r09K, r10, r10K], branches: '*'}
    outcomes:
      - [PASS, 'gates_inputs.I4.flip_rate < 0.05']
    else: FAIL
    gates_summary:
      I4_pass: "status == 'PASS'"

  - id: I5
    title: Judge entanglement (keywords shown) and the Qwen self-preference check
    applies_to:
      - {runs: [r00], branches: [N]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    reads: [gates_inputs.I5.kappa_drop]
    status: REPORTED
    derive:
      gates.I5.prediction_met: 'gates_inputs.I5.kappa_drop >= 0.05'

  # ---- the vault, adoption and the R00 sign-off -----------------------------------------------

  - id: vault.read
    title: Vault read at a registered read point
    # Out of scope the harness refuses a read (a read recorded there fails the run). In scope a
    # missing read is NOT_COMPUTABLE, and a lost key records sign 'unavailable'.
    applies_to:
      - {runs: [r04], branches: [N]}
      - {runs: [r06], branches: [N]}
      - {runs: [r07], branches: [S-C]}
      - {runs: [r10], branches: [N, S-C]}
      - {runs: [r10K], branches: [K]}
    reads: [vault.sign, vault.read_index]
    outcomes:
      - [DONE, 'vault.read_this_run']
    else: NOT_COMPUTABLE

  - id: adoption.default
    title: Nested cross-fitted adoption, default rule
    # Per fold: an arm qualifies if gain_lfo >= min_gain AND guard_ok (no other primary stratum's
    # leave-fold-out point falls by more than 0.01). The highest qualifying arm is chosen (ties by
    # arm_id); if none qualifies, the parent is kept (chosen_arm 'parent'). Control arms are never
    # candidates.
    applies_to:
      - {runs: [r01, r02, r03, r04, r05, r06], branches: [N]}
      - {runs: [r06], branches: [S-F, S-C]}
      - {runs: [r07], branches: [S-C]}
    adopt: {method: default, min_gain: 0.01}
    status: DONE

  - id: adoption.squeeze
    title: Squeeze ship choice
    # Per fold: among non-control arms with model_bundle_raw <= max_bundle_raw and a leave-fold-out
    # AB gain within `within` of the fold's best arm, choose the smallest bundle (ties: higher gain,
    # then arm_id); if none, keep the parent.
    applies_to:
      - {runs: [r07], branches: [N]}
      - {runs: [r08], branches: [S-C]}
    adopt: {method: squeeze, within: 0.01, max_bundle_raw: 4000000}
    status: DONE

  - id: signoff
    title: R00 preconditions for Fable's PREREG sign-off
    # lint_ok means `arcforge prereg lint --frozen` passed (applies_to expansion, computability and
    # every tau = max(tau_floor, mde_r00)); report_valid that report.json validates against
    # arc-report/1; vault_sealed that vault.sealed_sha256 is present and published in the bench
    # card. I3 and I5 must be non-null. verdicts.json lists every rule (checked structurally) with
    # every H rule NOT_APPLICABLE at r00.
    applies_to: [{runs: [r00], branches: [N]}]
    reads: [gates_inputs.I3.student_chrome_in, gates_inputs.I5.kappa_drop]
    let:
      # I1 passed, or its pre-registered fallback is scheduled (PREREG-A1 registered, the r01 plan
      # carries the re-judge line; H1's family is [c1, c3] until I1 passes, see H1's let F).
      judges_ok: 'gates_summary.I1_pass or signoff_inputs.i1_fallback_scheduled'
      every_h_rule_not_applicable: >-
        OUT_OF_SCOPE('FUT', 'H1.F', 'H1', 'H2', 'H3', 'H3a', 'H3b', 'H4', 'H5', 'H6', 'H7',
        'H7.report', 'K1')
    outcomes:
      - - PASS
        - >-
          signoff_inputs.lint_ok and signoff_inputs.report_valid and signoff_inputs.vault_sealed
          and judges_ok and signoff_inputs.i2_scheduled and signoff_inputs.i4_scheduled
          and every_h_rule_not_applicable
    else: FAIL
