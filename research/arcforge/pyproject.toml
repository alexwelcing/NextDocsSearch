[project]
name = "arcforge"
version = "0.1.0"
description = "RE-MEANING: The Calibration Runs — the reproducible ~$20 run pipeline behind arc-lexeme, a corpus-native static embedding model for the alexwelcing.com archive."
readme = "README.md"
requires-python = ">=3.11"
# The core stays light: the laptop-side commands (owner desk, vault, plan, verdict, prereg lint)
# must run anywhere. GPU and cloud stacks live in optional extras installed on the runner VM.
dependencies = ["pyyaml>=6", "jsonschema>=4.21"]

[project.optional-dependencies]
gpu = ["torch>=2.9", "sentence-transformers>=5", "model2vec>=0.10", "tokenizers>=0.21", "numpy>=2"]
cloud = ["google-cloud-storage>=2.18", "google-cloud-compute>=1.20", "google-cloud-billing>=1.14", "google-cloud-secret-manager>=2.20"]
dev = ["pytest>=8"]

[project.scripts]
arcforge = "arcforge.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arcforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
