# Lint, unit tests and the full production build, on every PR and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Default shallow clone: lint/test/build need the tree, not ~1.2 GB of history. The tree
      # carries public/images, which the build's media guard (scripts/guard-media.ts) requires.
      - uses: actions/checkout@v7

      # No version input: pnpm/action-setup reads packageManager (pnpm@9.7.1) from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
