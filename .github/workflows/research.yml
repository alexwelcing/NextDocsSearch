name: Research (arcforge)

on:
  pull_request:
    paths: ['research/**', '.github/workflows/research.yml']
  push:
    branches: [main]
    paths: ['research/**', '.github/workflows/research.yml']

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: arcforge tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/arcforge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv run --extra dev pytest -q
      - run: uv run arcforge --help
