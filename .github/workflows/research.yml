name: Research (arcforge)

on:
  pull_request:
    paths: ['research/**', 'lib/archive/**', 'lib/retrieval/**', '.github/workflows/research.yml']
  push:
    branches: [main]
    paths: ['research/**', 'lib/archive/**', 'lib/retrieval/**', '.github/workflows/research.yml']

permissions:
  contents: read

concurrency:
  group: research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: arcforge tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.14']
    env:
      UV_LOCKED: '1'
      ARCFORGE_STRICT_COMMANDS: '1'
    defaults:
      run:
        working-directory: research/arcforge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync arcforge --help

  bare-python:
    # The owner desk and vault must run on a laptop with no uv and no extras.
    name: arcforge on a bare python3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ARCFORGE_STRICT_COMMANDS: '1'
    defaults:
      run:
        working-directory: research/arcforge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -S -m arcforge --help
      - run: python -S -m arcforge version
